[package]
name = "spotlight"
description = "Spotlight launcher binary: wiring, window lifecycle, self-test"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
embed-resource = "3"
# The local date for dev build versions (already in the tree through GPUI).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[dependencies]
async-channel.workspace = true
gpui.workspace = true
raw-window-handle.workspace = true
spotlight-core.workspace = true
spotlight-platform-win.workspace = true
spotlight-providers.workspace = true
spotlight-store.workspace = true
spotlight-ui.workspace = true
tray-icon.workspace = true
