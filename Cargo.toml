[workspace]
resolver = "3"
members = ["crates/spike-common", "spikes/gpui"]

[workspace.package]
edition = "2024"
version = "0.0.0"
# Let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
spike-common = { path = "crates/spike-common" }
async-channel = "2"
nucleo-matcher = "0.3.1"
raw-window-handle = "0.6"
unicode-segmentation = "1"
# Same major as gpui 0.2.2 uses, so there is only one copy of the bindings.
windows = "0.61"

[profile.release]
debug = "line-tables-only"
