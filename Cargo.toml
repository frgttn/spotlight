[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
edition = "2024"
version = "0.0.0"
# Let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frgttn/spotlight"
publish = false

[workspace.dependencies]
spotlight-core = { path = "crates/core" }
spotlight-platform-win = { path = "crates/platform-win" }
spotlight-search = { path = "crates/search" }
spotlight-store = { path = "crates/store" }
spotlight-ui = { path = "crates/ui" }
async-channel = "2"
gpui = "=0.2.2"
nucleo-matcher = "0.3.1"
raw-window-handle = "0.6"
# `bundled` compiles SQLite from source, so there is no system library to install.
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-segmentation = "1"
# Same major as gpui 0.2.2 uses, so there is only one copy of the bindings.
windows = "0.61"

[profile.release]
debug = "line-tables-only"
