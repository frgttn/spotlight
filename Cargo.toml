[workspace]
resolver = "3"
members = ["crates/*"]
# Patched dependencies, built but not linted or tested as ours.
exclude = ["vendor"]
default-members = ["crates/app", "crates/service"]

[workspace.package]
edition = "2024"
version = "0.2.0"
# Let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frgttn/spotlight"
publish = false

[workspace.dependencies]
spotlight-core = { path = "crates/core" }
spotlight-files = { path = "crates/files" }
spotlight-platform-win = { path = "crates/platform-win" }
spotlight-providers = { path = "crates/providers" }
spotlight-search = { path = "crates/search" }
spotlight-store = { path = "crates/store" }
spotlight-ui = { path = "crates/ui" }
async-channel = "2"
# Calculator: units, arbitrary precision, no dependencies of its own.
fend-core = "1.5.9"
# File index: sorted, compressed set of file names with prefix lookups.
fst = "0.4.7"
gpui = "=0.2.2"
# Only for its `Frame`/`RgbaImage` types in GPUI's image API; same version as gpui uses.
image = { version = "0.25", default-features = false }
# File search matcher: SIMD Smith-Waterman with typos, no dependencies (taken from fff).
neo_frizbee = "0.13.3"
nucleo-matcher = "0.3.1"
# Markdown in detail views; no HTML output needed.
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
# `bundled-sqlcipher` compiles SQLCipher (SQLite with encryption) from source,
# so there is no system library to install; its crypto is Windows CNG, see
# the patch below.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde_json = "1"
tray-icon = "0.24"
unicode-segmentation = "1"
# Same major as gpui 0.2.2 uses, so there is only one copy of the bindings.
windows = "0.61"

# libsqlite3-sys with one change: on Windows, SQLCipher's crypto comes from
# CNG (bcrypt.dll, `sqlcipher/crypto_cng.c`) instead of OpenSSL, so building
# needs no OpenSSL or Perl. Its unused plain-SQLite sources are left out.
# Keep its version equal to the one rusqlite asks for.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[profile.release]
debug = "line-tables-only"
